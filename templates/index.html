<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalEase - AI Legal Document Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>LegalEase</h1>
            <p>AI-Powered Legal Document Generator</p>
        </div>

        <div class="card">

            <form method="POST" onsubmit="showLoading()">

                <label for="document_type">Document Type</label>

                <select name="document_type" id="document_type" required>
                    <option value="">Select Document Type</option>
                    <option value="Rental Agreement">Rental Agreement</option>
                    <option value="Leave and License Agreement">
                        Leave and License Agreement
                    </option>
                    <option value="Employment Agreement">
                        Employment Agreement
                    </option>
                    <option value="Non-Disclosure Agreement">
                        Non-Disclosure Agreement
                    </option>
                    <option value="Affidavit">Affidavit</option>
                    <option value="General Legal Notice">
                        General Legal Notice
                    </option>
                </select>

                <label for="details">Enter Details</label>

                <textarea
                    name="details"
                    id="details"
                    placeholder="Enter the required details here..."
                    required
                ></textarea>

                <button type="submit">
                    Generate Legal Document
                </button>
                <br>

                <a href="{{ url_for('history') }}" class="history-link">
                    View Document History
                </a>

            </form>

        </div>

        {% if result %}

        <div class="card">

            <h2>Generated Document</h2>
            <button type="button" onclick="toggleEdit()" id="editButton">
                 Edit Document
            </button>

            <textarea id="editArea" style="display:none; margin-top:15px; min-height:400px;">{{ result | striptags }}</textarea>

            <button type="button" onclick="saveEdit()" id="saveButton" style="display:none; margin-top:10px;">
                 Save Changes
            </button>

            <br>

            <div class="result">
                {{ result | safe}}
            </div>
            <br>
            <br>

           <div class="download-buttons">

        <form method="POST" action="{{ url_for('download_txt') }}">
            <input type="hidden" name="content" value="{{ result | striptags }}">
            <button type="submit">Download TXT</button>
        </form>

        <form method="POST" action="{{ url_for('download_docx') }}">
            <input type="hidden" name="content" value="{{ result | striptags }}">
            <button type="submit">Download DOCX</button>
         </form>

        <form method="POST" action="{{ url_for('download_pdf') }}">
            <input type="hidden" name="content" value="{{ result | striptags }}">
            <button type="submit">Download PDF</button>
        </form>

</div>
        </div>

        {% endif %}

    </div>
<script>
function showLoading() {
    const button = document.querySelector('button[type="submit"]');

    button.innerText = "Generating Document... ⏳";
    button.disabled = true;
}
</script>
<script>
function toggleEdit() {
    document.getElementById("editArea").style.display = "block";
    document.getElementById("saveButton").style.display = "block";
    document.getElementById("editButton").style.display = "none";
}

function saveEdit() {
    const editedText = document.getElementById("editArea").value;

    document.querySelector(".result").innerText = editedText;

    document.getElementById("editArea").style.display = "none";
    document.getElementById("saveButton").style.display = "none";
    document.getElementById("editButton").style.display = "block";
}
</script>
</body>
</html>
